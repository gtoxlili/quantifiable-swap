# Configuration for multiple trading and notification jobs
- type: swap
  symbol:
    base: eth
    quote: usdt
  bar: 15m
  amount:
    sell: 150
    buy: 300
  provider:
    name: okx

- type: swap
  symbol:
    base: eth
    quote: usdt
  bar: 1h
  amount:
    sell: 200
    buy: 400
  provider:
    name: binance
    inject_order: okx

- type: swap
  symbol:
    base: eth
    quote: usdt
  bar: 4h
  amount:
    sell: 300
    buy: 600
  provider:
    name: binance
    inject_order: okx

- type: swap
  symbol:
    base: aero
    quote: usdt
  bar: 1h
  amount:
    sell: 100
    buy: 200
  provider:
    name: bybit

- type: notify
  symbol:
    base: btc
    quote: usdt
  bar: 15m
  provider:
    name: binance

- type: swap
  symbol:
    base: aero
    quote: usdt
  bar: 15m
  amount:
    sell: 100
    buy: 100
  provider:
    name: bybit
