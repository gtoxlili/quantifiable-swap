version: '3'

vars:
  BINARY_NAME:
  OKX_API_KEY:
  OKX_SECRET_KEY:
  OKX_PASSPHRASE:
  BARK_TOKEN:

tasks:
  clean:
    cmds:
      - rm -rf dist
      - mkdir -p dist
  build:
    label: build-{{.TASK}}
    cmds:
      - |
        GOOS={{.GOOS}} GOARCH={{.GOARCH}} GOARM={{.GOARM}} GOMIPS={{.GOMIPS}} \
        CGO_ENABLED=0 \
        go build -trimpath -o ./dist/{{.BINARY_NAME}} \
        -ldflags "-X 'github.com/gtoxlili/quantifiable-swap/constants.OkxAPIKey={{.OKX_API_KEY}}' \
        -X 'github.com/gtoxlili/quantifiable-swap/constants.OkxSecretKey={{.OKX_SECRET_KEY}}' \
        -X 'github.com/gtoxlili/quantifiable-swap/constants.OkxPassphrase={{.OKX_PASSPHRASE}}' \
        -X 'github.com/gtoxlili/quantifiable-swap/constants.ProxyAddr={{.PROXY_ADDR}}' \
        -X 'github.com/gtoxlili/quantifiable-swap/constants.BarkToken={{.BARK_TOKEN}}' \
        -w -s -buildid="
  linux-amd64:
    vars:
      REMOTE_PM2_PATH:
      REMOTE_ADDRESS:
      REMOTE_PATH:
    cmds:
      - task: build
        vars: {
          TASK: "{{.TASK}}",
          GOOS: linux,
          GOARCH: amd64,
          PROXY_ADDR:
        }
      - ssh {{.REMOTE_ADDRESS}} "{{.REMOTE_PM2_PATH}} delete {{.BINARY_NAME}}"
      - scp -r ./dist/{{.BINARY_NAME}} {{.REMOTE_ADDRESS}}:{{.REMOTE_PATH}}
      - ssh {{.REMOTE_ADDRESS}} "{{.REMOTE_PM2_PATH}} start {{.REMOTE_PATH}}{{.BINARY_NAME}};{{.REMOTE_PM2_PATH}} save"
  darwin-amd64:
    cmds:
      - task: build
        vars: {
          TASK: "{{.TASK}}",
          GOOS: darwin,
          GOARCH: amd64,
        }
  default:
    cmds:
      - task: clean
      - task: linux-amd64
  dev:
    cmds:
      - task: clean
      - task: darwin-amd64

