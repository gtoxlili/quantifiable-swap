version: '3'

vars:
  LOG_LEVEL: info
  BINARY_NAME:
  OKX_API_KEY:
  OKX_SECRET_KEY:
  OKX_PASSPHRASE:
  BARK_TOKEN:
  BYBIT_API_KEY:
  BYBIT_API_SECRET:
  TG_BOT_TOKEN:
  TG_BOT_NAME:
  TG_CHAT_ID:
  REMOTE_ADDRESS:
  REMOTE_DIR:

tasks:
  clean:
    cmds:
      - rm -rf dist
      - mkdir -p dist
  build:
    label: build-{{.TASK}}
    cmds:
      - |
        GOOS={{.GOOS}} GOARCH={{.GOARCH}} GOARM={{.GOARM}} GOMIPS={{.GOMIPS}} \
        CGO_ENABLED=0 \
        go build -trimpath -o ./dist/{{.BINARY_NAME}} \
        -ldflags "-X 'github.com/gtoxlili/quantifiable-swap/constants.OkxAPIKey={{.OKX_API_KEY}}' \
        -X 'github.com/gtoxlili/quantifiable-swap/constants.OkxSecretKey={{.OKX_SECRET_KEY}}' \
        -X 'github.com/gtoxlili/quantifiable-swap/constants.OkxPassphrase={{.OKX_PASSPHRASE}}' \
        -X 'github.com/gtoxlili/quantifiable-swap/constants.ProxyAddr={{.PROXY_ADDR}}' \
        -X 'github.com/gtoxlili/quantifiable-swap/constants.BarkToken={{.BARK_TOKEN}}' \
        -X 'github.com/gtoxlili/quantifiable-swap/constants.ByBitAPIKey={{.BYBIT_API_KEY}}' \
        -X 'github.com/gtoxlili/quantifiable-swap/constants.ByBitAPISecret={{.BYBIT_API_SECRET}}' \
        -X 'github.com/gtoxlili/quantifiable-swap/constants.TGBotToken={{.TG_BOT_TOKEN}}' \
        -X 'github.com/gtoxlili/quantifiable-swap/constants.TGBotName={{.TG_BOT_NAME}}' \
        -X 'github.com/gtoxlili/quantifiable-swap/constants.tmpTgChatID={{.TG_CHAT_ID}}' \
        -X 'github.com/gtoxlili/quantifiable-swap/constants.LogLevel={{.LOG_LEVEL}}' \
        -w -s -buildid="
  # 上传程序至远程服务器
  deploy-binary:
    cmds:
      - ssh {{.REMOTE_ADDRESS}} "mkdir -p {{.REMOTE_DIR}}"
      - ssh {{.REMOTE_ADDRESS}} "{{.REMOTE_PM2_PATH}} delete {{.BINARY_NAME}} || true"
      - scp -r ./dist/{{.BINARY_NAME}} {{.REMOTE_ADDRESS}}:{{.REMOTE_DIR}}
      - ssh {{.REMOTE_ADDRESS}} "cd {{.REMOTE_DIR}};{{.REMOTE_PM2_PATH}} start {{.BINARY_NAME}};{{.REMOTE_PM2_PATH}} save"
  # 上传配置文件至远程服务器
  deploy-config:
    cmds:
      - ssh {{.REMOTE_ADDRESS}} "mkdir -p {{.REMOTE_DIR}}"
      - scp -r ./config.yaml {{.REMOTE_ADDRESS}}:{{.REMOTE_DIR}}
  linux-amd64:
    cmds:
      - task: build
        vars: {
          TASK: "{{.TASK}}",
          GOOS: linux,
          GOARCH: amd64,
          PROXY_ADDR:
        }
  darwin-amd64:
    cmds:
      - task: build
        vars: {
          TASK: "{{.TASK}}",
          GOOS: darwin,
          GOARCH: amd64,
          LOG_LEVEL: "{{.LOG_LEVEL}}"
        }
  default:
    cmds:
      - task: clean
      - task: linux-amd64
      - task: deploy-config
      - task: deploy-binary
        vars: {
          REMOTE_PM2_PATH:
        }
  dev:
    cmds:
      - task: clean
      - task: darwin-amd64
        vars: {
          LOG_LEVEL: debug
        }
